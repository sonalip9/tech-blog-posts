<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">What depends on what in the monorepo</title>
  <desc id="d">apps/api imports HealthResponse from packages/types and extends the lint config and tsconfig from packages/config. packages/types also extends the tsconfig from packages/config. The frontends added in Post 2 will import from packages/types.</desc>
  <style>@import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap');
    .sans{font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1B2B66"/></marker>
  </defs>
  <rect width="720" height="440" fill="#FBF7F0"/>
  <g class="sans" text-anchor="middle" font-weight="700" fill="#1B2B66">
    <rect x="190" y="30" width="240" height="72" rx="8" fill="#2E5AA7"/>
    <text x="310" y="62" font-size="18" fill="#FBF7F0">apps/api</text>
    <text x="310" y="84" font-size="15" font-weight="400" fill="#FBF7F0">NestJS, GET /health</text>

    <rect x="190" y="185" width="240" height="72" rx="8" fill="#FBEFC9" stroke="#1B2B66" stroke-width="2"/>
    <text x="310" y="217" font-size="18">packages/types</text>
    <text x="310" y="239" font-size="15" font-weight="400">@template/types</text>

    <rect x="190" y="340" width="240" height="72" rx="8" fill="#FBEFC9" stroke="#1B2B66" stroke-width="2"/>
    <text x="310" y="372" font-size="18">packages/config</text>
    <text x="310" y="394" font-size="15" font-weight="400">@template/config</text>

    <rect x="500" y="185" width="200" height="72" rx="8" fill="#FBF7F0" stroke="#1B2B66" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="600" y="217" font-size="18">frontends</text>
    <text x="600" y="239" font-size="15" font-weight="400">added in Post 2</text>
  </g>
  <g stroke="#1B2B66" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)">
    <path d="M310 104 V183"/>
    <path d="M310 259 V338"/>
    <path d="M188 66 H160 V376 H188"/>
    <path d="M498 221 H434" stroke-dasharray="7 6"/>
  </g>
  <g class="sans" font-size="15" fill="#1B2B66">
    <text x="324" y="150">imports HealthResponse</text>
    <text x="324" y="305">extends tsconfig</text>
    <g text-anchor="end">
      <text x="148" y="196">extends</text>
      <text x="148" y="215">lint config</text>
      <text x="148" y="234">and tsconfig</text>
    </g>
  </g>
</svg>
