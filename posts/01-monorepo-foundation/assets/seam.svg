<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">A seam: the one place a library can be swapped</title>
  <desc id="d">Your code calls a port that you own. The port is the swap point. A library sits behind it in an adapter folder, and another library can replace it without changing your code.</desc>
  <style>@import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap');
    .sans{font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1B2B66"/></marker>
  </defs>
  <rect width="720" height="340" fill="#FBF7F0"/>
  <g class="sans" text-anchor="middle" font-weight="700">
    <rect x="30" y="135" width="150" height="72" rx="8" fill="#2E5AA7"/>
    <text x="105" y="177" font-size="18" fill="#FBF7F0">Your code</text>

    <rect x="250" y="105" width="170" height="132" rx="10" fill="#FBF7F0" stroke="#6B3F69" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="335" y="162" font-size="18" fill="#6B3F69">Port you own</text>
    <text x="335" y="186" font-size="15" font-weight="400" fill="#6B3F69">the swap point</text>

    <rect x="490" y="45" width="200" height="72" rx="8" fill="#FBEFC9" stroke="#1B2B66" stroke-width="2"/>
    <text x="590" y="87" font-size="18" fill="#1B2B66">A library you use</text>

    <rect x="490" y="225" width="200" height="72" rx="8" fill="#FBF7F0" stroke="#1B2B66" stroke-width="2" stroke-dasharray="2 5"/>
    <text x="590" y="267" font-size="16" font-weight="400" fill="#1B2B66">Another library</text>
  </g>
  <g stroke="#1B2B66" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#ah)">
    <path d="M182 171 H248"/>
    <path d="M422 140 L488 100"/>
    <path d="M422 202 L488 242" stroke-dasharray="2 5"/>
  </g>
  <text class="sans" x="590" y="145" text-anchor="middle" font-size="15" fill="#1B2B66">adapter folder</text>
  <text class="sans" x="590" y="205" text-anchor="middle" font-size="15" fill="#1B2B66">replaces it later</text>
</svg>
